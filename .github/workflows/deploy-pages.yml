# Generated from a verified website export in the private catalogue project.
name: Deploy catalogue website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-pages
  cancel-in-progress: false

jobs:
  verify-and-upload:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the website export
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check export contents and verified bytes
        shell: bash
        run: |
          test -z "$(find . -path './.git' -prune -o -type l -print)"
          test "$(find . -mindepth 1 -path './.git' -prune -o -printf '%P\n' | LC_ALL=C sort)" = "$(printf '%s\n' '.gitattributes' '.github' '.github/workflows' '.github/workflows/deploy-pages.yml' 'site' 'site/FAQ evidence.html' 'site/Pilot report.html' 'site/index.html')"
          test -z "$(find site -mindepth 1 ! -type f -print)"
          sha256sum --check --strict <<'SHA256'
          bed5ee1a8c268cb0296a8fd38c8730872fd15bd0bb54b94331e134731b9626b3  .gitattributes
          3a7b48cec1b38eeb54d9f135298bd300a1537bcefb6b27d732bfafc9c90f1787  site/FAQ evidence.html
          7bf96c94454ff8a2e4133f008abf50fde32e459cdc33373b7c19ae8d9426e02c  site/Pilot report.html
          dfaea3e86897b64cf4dd6970ec058830b78e97e83fa928ce8c42b8ba8b3ea0fb  site/index.html
          SHA256
      - name: Upload only the website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: verify-and-upload
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
